<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>مدیریت محتوی کلاسها</title>

<link
  href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>

/* =========================================================
   PREMIUM SHEET MANAGER
   Soft UI + Glassmorphism + Responsive
========================================================= */

:root {

    --primary: #6d5dfc;
    --primary-dark: #5146d9;
    --secondary: #3b82f6;

    --text: #263238;
    --muted: #718096;

    --glass: rgba(255,255,255,.72);

    --border: rgba(255,255,255,.70);

    --shadow:
        0 25px 70px rgba(45,55,72,.13),
        0 8px 25px rgba(109,93,252,.08);

    --soft-shadow:
        8px 8px 20px rgba(163,177,198,.22),
        -8px -8px 20px rgba(255,255,255,.85);

    --radius: 22px;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    padding: 35px 18px;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    color: var(--text);

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(109,93,252,.16),
            transparent 32%
        ),

        radial-gradient(
            circle at 90% 85%,
            rgba(59,130,246,.14),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #eef2ff,
            #f8fafc 50%,
            #edf4ff
        );
}


/* =========================================================
   DECORATIVE BACKGROUND
========================================================= */

body::before,
body::after {

    content: "";

    position: fixed;

    z-index: -1;

    border-radius: 50%;

    pointer-events: none;

    filter: blur(2px);
}

body::before {

    width: 260px;
    height: 260px;

    top: 40px;
    left: -100px;

    background:
        rgba(109,93,252,.12);
}

body::after {

    width: 320px;
    height: 320px;

    right: -130px;
    bottom: 20px;

    background:
        rgba(59,130,246,.10);
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {

    width: min(1250px, 96%);

    margin: auto;
}


/* =========================================================
   TOP HEADER
========================================================= */

.header {

    position: relative;

    margin-bottom: 20px;

    padding: 25px 28px;

    border-radius: 25px;

    background:
        rgba(255,255,255,.62);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    border:
        1px solid rgba(255,255,255,.78);

    box-shadow:
        var(--shadow);

    overflow: hidden;
}

.header::before {

    content: "";

    position: absolute;

    top: 0;
    right: 0;
    left: 0;

    height: 5px;

    background:
        linear-gradient(
            90deg,
            #6d5dfc,
            #8b5cf6,
            #3b82f6,
            #06b6d4
        );
}

.header h1 {

    margin: 0;

    color: #4038a8;

    font-size: 24px;

    font-weight: 800;

    letter-spacing: -.4px;
}

.header p {

    margin:
        7px 0 0;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.8;
}


/* =========================================================
   LAYOUT
========================================================= */

.layout {

    display: grid;

    grid-template-columns:
        285px
        minmax(0, 1fr);

    gap: 20px;

    align-items: start;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    position: sticky;

    top: 20px;

    overflow: hidden;

    border-radius: 24px;

    background:
        rgba(255,255,255,.62);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    border:
        1px solid rgba(255,255,255,.75);

    box-shadow:
        var(--shadow);
}


/* =========================================================
   ACCORDION HEADER
========================================================= */

.accordion-title {

    min-height: 70px;

    padding:
        14px 18px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    cursor: pointer;

    user-select: none;

    color: #334155;

    font-size: 15px;

    font-weight: 800;

    background:
        rgba(255,255,255,.35);

    border-bottom:
        1px solid rgba(226,232,240,.65);

    transition:
        .3s ease;
}

.accordion-title:hover {

    background:
        rgba(255,255,255,.65);
}

.accordion-title span {

    width: 34px;
    height: 34px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    color: var(--primary);

    background:
        rgba(109,93,252,.09);

    transition:
        transform .35s ease,
        background .3s ease;
}

.accordion-title.active span {

    transform:
        rotate(180deg);

    background:
        rgba(109,93,252,.15);
}


/* =========================================================
   SHEET LIST
========================================================= */

.sheet-list {

    display: none;

    padding: 10px;
}

.sheet-list.open {

    display: block;
}


/* =========================================================
   SHEET ITEM
========================================================= */

.sheet-item {

    position: relative;

    width: 100%;

    min-height: 52px;

    margin-bottom: 6px;

    padding:
        8px 12px;

    display: flex;

    align-items: center;

    gap: 11px;

    border: 1px solid transparent;

    border-radius: 14px;

    background:
        rgba(255,255,255,.32);

    color: #475569;

    text-align: right;

    cursor: pointer;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    font-size: 13px;

    transition:
        .25s ease;
}

.sheet-item:last-child {

    margin-bottom: 0;
}

.sheet-item span:first-child {

    width: 36px;
    height: 36px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 12px;

    background:
        rgba(109,93,252,.08);

    color:
        var(--primary);

    font-size: 17px;

    box-shadow:

        inset 2px 2px 5px
        rgba(163,177,198,.15),

        inset -2px -2px 5px
        rgba(255,255,255,.8);
}

.sheet-item:hover {

    transform:
        translateX(-3px);

    background:
        rgba(255,255,255,.80);

    border-color:
        rgba(109,93,252,.18);

    box-shadow:
        0 7px 18px
        rgba(109,93,252,.08);
}

.sheet-item.active {

    background:
        rgba(109,93,252,.11);

    border-color:
        rgba(109,93,252,.25);

    color:
        #4038a8;

    font-weight: 700;

    box-shadow:
        0 6px 18px
        rgba(109,93,252,.10);
}

.sheet-item.active span:first-child {

    background:
        rgba(109,93,252,.16);

    color:
        var(--primary-dark);
}


/* =========================================================
   CONTENT
========================================================= */

.content {

    position: relative;

    min-height: 500px;

    padding: 28px;

    border-radius: 26px;

    background:
        rgba(255,255,255,.62);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    border:
        1px solid rgba(255,255,255,.78);

    box-shadow:
        var(--shadow);

    overflow: hidden;
}

.content::before {

    content: "";

    position: absolute;

    top: 0;
    right: 0;
    left: 0;

    height: 5px;

    background:
        linear-gradient(
            90deg,
            #6d5dfc,
            #8b5cf6,
            #3b82f6,
            #06b6d4
        );
}


/* =========================================================
   CONTENT TITLE
========================================================= */

.content-title {

    position: relative;

    margin:
        5px 0 25px;

    padding-bottom: 15px;

    color: #4038a8;

    font-size: 21px;

    font-weight: 800;

    border-bottom:
        1px solid
        rgba(226,232,240,.8);
}

.content-title::before {

    content: "◈";

    margin-left: 9px;

    color:
        var(--primary);

    font-size: 18px;
}


/* =========================================================
   FORM GRID
========================================================= */

.form-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:
        18px;
}


/* =========================================================
   FORM GROUP
========================================================= */

.form-group {

    display: flex;

    flex-direction: column;

    gap: 8px;
}

.form-group.full {

    grid-column:
        1 / -1;
}


/* =========================================================
   LABEL
========================================================= */

.form-group label {

    color: #475569;

    font-size: 13px;

    font-weight: 700;
}


/* =========================================================
   INPUTS
========================================================= */

input,
textarea,
select {

    width: 100%;

    border:
        1px solid
        rgba(203,213,225,.75);

    border-radius: 14px;

    background:
        rgba(248,250,252,.82);

    color: #334155;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    font-size: 13px;

    outline: none;

    transition:
        .25s ease;
}

input,
select {

    height: 50px;

    padding:
        0 15px;
}

textarea {

    min-height: 115px;

    padding:
        13px 15px;

    resize:
        vertical;

    line-height:
        1.8;
}


/* =========================================================
   INPUT HOVER
========================================================= */

input:hover,
textarea:hover,
select:hover {

    border-color:
        rgba(109,93,252,.35);

    background:
        rgba(255,255,255,.92);
}


/* =========================================================
   INPUT FOCUS
========================================================= */

input:focus,
textarea:focus,
select:focus {

    border-color:
        rgba(109,93,252,.75);

    background:
        rgba(255,255,255,.97);

    box-shadow:

        0 0 0 4px
        rgba(109,93,252,.10),

        0 7px 18px
        rgba(109,93,252,.08);

    transform:
        translateY(-1px);
}

::placeholder {

    color:
        #a0aec0;
}


/* =========================================================
   SELECT
========================================================= */

select {

    direction: rtl;

    text-align: right;

    cursor: pointer;
}


/* =========================================================
   ACTIONS
========================================================= */

.actions {

    margin-top: 25px;

    display: flex;

    justify-content: flex-start;

    gap: 10px;
}


/* =========================================================
   SUBMIT BUTTON
========================================================= */

button.submit {

    width: 100%;

    min-height: 58px;

    margin-top: 0;

    border: 0;

    border-radius: 17px;

    background:

        linear-gradient(
            135deg,
            #6d5dfc,
            #5146d9 45%,
            #3b82f6
        );

    color: white;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    font-size: 15px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:

        0 12px 28px
        rgba(109,93,252,.28),

        inset 0 1px 0
        rgba(255,255,255,.25);

    transition:
        .3s ease;
}

button.submit:hover {

    transform:
        translateY(-3px);

    box-shadow:

        0 18px 35px
        rgba(109,93,252,.35),

        inset 0 1px 0
        rgba(255,255,255,.30);
}

button.submit:active {

    transform:
        translateY(0)
        scale(.985);
}

button.submit:disabled {

    opacity: .6;

    cursor:
        not-allowed;

    transform:
        none;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty {

    min-height: 400px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    color: #94a3b8;

    font-size: 14px;
}

.empty::before {

    content: "📋";

    width: 70px;
    height: 70px;

    margin-bottom: 18px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 22px;

    background:
        rgba(109,93,252,.08);

    box-shadow:
        var(--soft-shadow);

    font-size: 30px;
}


/* =========================================================
   LOADING
========================================================= */

.loading {

    padding: 25px;

    text-align: center;

    color:
        #718096;

    font-size: 13px;
}

.loading::before {

    content: "◌";

    display: inline-block;

    margin-left: 7px;

    color:
        var(--primary);

    font-size: 18px;

    animation:
        loadingSpin 1s linear infinite;
}

@keyframes loadingSpin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   STATUS
========================================================= */

.status {

    margin-top: 16px;

    padding:
        12px 15px;

    border-radius: 13px;

    font-size: 13px;

    line-height: 1.8;

    display: none;
}

.status.success {

    display: block;

    background:
        rgba(16,185,129,.09);

    border:
        1px solid
        rgba(16,185,129,.20);

    color:
        #047857;
}

.status.error {

    display: block;

    background:
        rgba(239,68,68,.08);

    border:
        1px solid
        rgba(239,68,68,.18);

    color:
        #b91c1c;
}


/* =========================================================
   SCROLLBAR
========================================================= */

.sheet-list::-webkit-scrollbar {

    width: 5px;
}

.sheet-list::-webkit-scrollbar-track {

    background:
        rgba(226,232,240,.4);

    border-radius: 10px;
}

.sheet-list::-webkit-scrollbar-thumb {

    background:
        rgba(109,93,252,.30);

    border-radius: 10px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 850px) {

    body {

        padding:
            18px 10px;
    }

    .container {

        width: 100%;
    }

    .layout {

        grid-template-columns:
            1fr;
    }

    .sidebar {

        position:
            relative;

        top: auto;
    }

    .form-grid {

        grid-template-columns:
            1fr;
    }

    .form-group.full {

        grid-column:
            auto;
    }

    .content {

        padding:
            20px 15px;

        min-height:
            450px;
    }

    .header {

        padding:
            21px 18px;
    }

    .header h1 {

        font-size:
            20px;
    }
}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media (max-width: 450px) {

    body {

        padding:
            10px 6px;
    }

    .header {

        border-radius:
            20px;

        padding:
            18px 15px;
    }

    .sidebar,
    .content {

        border-radius:
            20px;
    }

    .content {

        padding:
            18px 12px;
    }

    .accordion-title {

        min-height:
            62px;

        padding:
            12px 14px;
    }

    .sheet-item {

        min-height:
            50px;

        font-size:
            12px;
    }

    .content-title {

        font-size:
            18px;
    }

    input,
    select {

        height:
            48px;
    }

    button.submit {

        min-height:
            55px;

        font-size:
            14px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        scroll-behavior:
            auto !important;

        transition:
            none !important;

        animation:
            none !important;
    }
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>
      مدیریت محتوی کلاسها
    </h1>

    <p>
      انتخاب کلاس و ثبت امحتوی
    </p>

  </div>


  <div class="layout">

    <aside class="sidebar">

      <div
        class="accordion-title active"
        id="accordionTitle"
        onclick="toggleAccordion()"
      >

        <div>
          📑 لیست کلاسها
        </div>

        <span>
          ▼
        </span>

      </div>


      <div
        class="sheet-list open"
        id="sheetList"
      >

        <div class="loading">
          در حال دریافت کلاس‌ها...
        </div>

      </div>

    </aside>


    <main class="content">

      <div id="formContainer">

        <div class="empty">

          ابتدا یک کلاس درس را از منوی سمت راست انتخاب کنید.

        </div>

      </div>

    </main>

  </div>

</div>


<script>

/* =====================================================
   GAS WEB APP
===================================================== */

const scriptURL =
"https://script.google.com/macros/s/AKfycbwBQJXmZKxRDVvN9fBBuLb7oJECg9ENLgSZy6g5xNhqP8tPF38RgOvnHSv_AU2bCYTWtw/exec";


/* =====================================================
   GLOBAL
===================================================== */

let currentSheet = "";

let currentHeaders = [];


/* =====================================================
   START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadSheets();

  }
);


/* =====================================================
   ACCORDION
===================================================== */

function toggleAccordion() {

  const title =
    document.getElementById("accordionTitle");

  const list =
    document.getElementById("sheetList");

  title.classList.toggle("active");

  list.classList.toggle("open");

}


/* =====================================================
   GET SHEETS
===================================================== */

async function loadSheets() {

  const list =
    document.getElementById("sheetList");

  try {

    const response =
      await fetch(
        scriptURL +
        "?action=getSheets"
      );

    const result =
      await response.json();

    if (!result.success) {

      throw new Error(
        result.error || "خطا در دریافت کلاس درس‌ها"
      );

    }

    list.innerHTML = "";

    if (
      !result.sheets ||
      result.sheets.length === 0
    ) {

      list.innerHTML =
        '<div class="loading">هیچ کلاس درسی پیدا نشد.</div>';

      return;
    }


    result.sheets.forEach(
      function(sheet) {

        const button =
          document.createElement("button");

        button.className =
          "sheet-item";

        button.innerHTML =
          `
          <span>📄</span>
          <span>${escapeHTML(sheet.name)}</span>
          `;

        button.onclick =
          function() {

            selectSheet(
              sheet.name,
              button
            );

          };

        list.appendChild(button);

      }
    );

  }

  catch (error) {

    list.innerHTML =
      `
      <div class="loading" style="color:#b91c1c">
        ${escapeHTML(error.message)}
      </div>
      `;

  }

}


/* =====================================================
   SELECT SHEET
===================================================== */

async function selectSheet(
  sheetName,
  button
) {

  currentSheet =
    sheetName;

  document
    .querySelectorAll(".sheet-item")
    .forEach(
      function(item) {

        item.classList.remove("active");

      }
    );

  button.classList.add("active");


  const container =
    document.getElementById(
      "formContainer"
    );

  container.innerHTML =
    `
    <div class="loading">
      در حال دریافت ساختار کلاس درس...
    </div>
    `;


  try {

    const response =
      await fetch(
        scriptURL +
        "?action=getHeaders&sheet=" +
        encodeURIComponent(sheetName)
      );

    const result =
      await response.json();

    if (!result.success) {

      throw new Error(
        result.error ||
        "خطا در دریافت Header"
      );

    }

    currentHeaders =
      result.headers || [];

    buildForm(
      sheetName,
      currentHeaders
    );

  }

  catch (error) {

    container.innerHTML =
      `
      <div class="status error">
        ${escapeHTML(error.message)}
      </div>
      `;

  }

}


/* =====================================================
   BUILD FORM
===================================================== */

function buildForm(
  sheetName,
  headers
) {

  const container =
    document.getElementById(
      "formContainer"
    );


  let html =
    `
    <h2 class="content-title">
      ${escapeHTML(sheetName)}
    </h2>

    <form
      id="dataForm"
      onsubmit="submitForm(event)"
    >

      <div class="form-grid">
    `;


  headers.forEach(
    function(header) {

      const name =
        header.name;

      /*
       * ستون زمان را کاربر وارد نمی‌کند
       */
      if (
        header.index === 1 &&
        (
          name === "ساعت و تاریخ" ||
          name === "تاریخ و ساعت" ||
          name.toLowerCase() === "timestamp"
        )
      ) {

        return;

      }


      const safeName =
        escapeHTML(name);


      /*
       * توضیحات دوره
       */
      if (
        name === "توضیحات دوره" ||
        name.includes("توضیحات")
      ) {

        html +=
          `
          <div class="form-group full">

            <label>
              ${safeName}
            </label>

            <textarea
              name="${safeName}"
              data-field="${safeName}"
            ></textarea>

          </div>
          `;

        return;

      }


      /*
       * سطح دسترسی
       */
      if (
        name === "سطح دسترسی"
      ) {

        html +=
          `
          <div class="form-group">

            <label>
              ${safeName}
            </label>

            <select
              name="${safeName}"
              data-field="${safeName}"
            >

              <option value="">
                انتخاب کنید
              </option>

              <option value="کامل">
                کامل
              </option>

              <option value="نیمه">
                نیمه
              </option>

              <option value="تبلیغاتی">
                تبلیغاتی
              </option>

              <option value="محدود">
                محدود
              </option>
			   <option value="VIP">
                VIP
              </option>

            </select>

          </div>
          `;

        return;

      }


      html +=
        `
        <div class="form-group">

          <label>
            ${safeName}
          </label>

          <input
            type="text"
            name="${safeName}"
            data-field="${safeName}"
            autocomplete="off"
          >

        </div>
        `;

    }
  );


  html +=
    `
      </div>

      <div class="actions">

        <button
          type="submit"
          class="submit"
          id="submitButton"
        >
          ثبت اطلاعات
        </button>

      </div>

      <div
        id="status"
        class="status"
      ></div>

    </form>
    `;


  container.innerHTML =
    html;

}


/* =====================================================
   SUBMIT
===================================================== */

async function submitForm(event) {

  event.preventDefault();


  if (!currentSheet) {

    showStatus(
      "ابتدا یک کلاس درس را انتخاب کنید.",
      "error"
    );

    return;

  }


  const form =
    document.getElementById(
      "dataForm"
    );

  const button =
    document.getElementById(
      "submitButton"
    );


  const data = {};


  form
    .querySelectorAll(
      "[data-field]"
    )
    .forEach(
      function(input) {

        const field =
          input.getAttribute(
            "data-field"
          );

        data[field] =
          input.value;

      }
    );


  button.disabled = true;

  button.textContent =
    "در حال ثبت...";


  try {

    const response =
      await fetch(
        scriptURL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            action: "addRow",

            sheet:
              currentSheet,

            data:
              data

          })

        }
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        "ثبت اطلاعات انجام نشد."
      );

    }


    showStatus(
      "اطلاعات با موفقیت ثبت شد. شماره ردیف: " +
      result.row,
      "success"
    );


    form
      .querySelectorAll(
        "input, textarea, select"
      )
      .forEach(
        function(input) {

          input.value = "";

        }
      );

  }

  catch (error) {

    showStatus(
      error.message,
      "error"
    );

  }


  button.disabled = false;

  button.textContent =
    "ثبت اطلاعات";

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );

  if (!status) {
    return;
  }

  status.className =
    "status " + type;

  status.textContent =
    message;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
