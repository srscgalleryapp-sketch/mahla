<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>media viewer</title>

    <!-- Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        /* =========================================================
           ROOT
        ========================================================= */

        :root {
            --primary: #d97706;
            --primary-light: #f59e0b;
            --primary-dark: #b45309;

            --bg: #eef1f5;
            --surface: #eef1f5;

            --text: #263238;
            --muted: #7b8794;

            --white: #ffffff;
            --border: rgba(255,255,255,.7);

            --shadow-light:
                -8px -8px 18px rgba(255,255,255,.95),
                 8px  8px 18px rgba(163,177,198,.35);

            --shadow-small:
                -4px -4px 10px rgba(255,255,255,.9),
                 4px  4px 10px rgba(163,177,198,.25);

            --shadow-inset:
                inset -4px -4px 8px rgba(255,255,255,.85),
                inset  4px  4px 8px rgba(163,177,198,.25);

            --radius-xl: 26px;
            --radius-lg: 20px;
            --radius-md: 15px;

            --sidebar-width: 285px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Vazirmatn", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================================================
           APP
        ========================================================= */

        .app {
            min-height: 100vh;
            display: flex;
        }

        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            right: 0;
            top: 0;

            padding: 22px 16px;

            background: var(--surface);

            box-shadow:
                -8px 0 25px rgba(163,177,198,.25);

            z-index: 1000;

            display: flex;
            flex-direction: column;

            transition: .35s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;

            padding: 12px 10px 25px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;

            border-radius: 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;

            color: white;

            background:
                linear-gradient(
                    145deg,
                    var(--primary-light),
                    var(--primary-dark)
                );

            box-shadow:
                -5px -5px 10px rgba(255,255,255,.8),
                 5px  5px 10px rgba(163,177,198,.3);
        }

        .brand-text h1 {
            font-size: 16px;
            font-weight: 800;
        }

        .brand-text span {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-top: 3px;
        }

        .sidebar-title {
            padding: 5px 13px 10px;

            color: var(--muted);

            font-size: 11px;
            font-weight: 700;
        }

        .sheet-menu {
            flex: 1;
            overflow-y: auto;

            padding: 5px 3px 20px;
        }

        .sheet-menu::-webkit-scrollbar {
            width: 5px;
        }

        .sheet-menu::-webkit-scrollbar-thumb {
            background: rgba(120,130,140,.25);
            border-radius: 20px;
        }

        .sheet-item {
            width: 100%;

            border: 0;
            background: transparent;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 13px 12px;

            border-radius: 15px;

            margin-bottom: 7px;

            color: var(--text);

            text-align: right;

            transition: .25s ease;
        }

        .sheet-item:hover {
            box-shadow: var(--shadow-small);
            transform: translateX(-2px);
        }

        .sheet-item.active {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--primary-light),
                    var(--primary)
                );

            box-shadow:
                0 8px 20px rgba(217,119,6,.25);
        }

        .sheet-icon {
            width: 35px;
            height: 35px;

            border-radius: 11px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            background: rgba(255,255,255,.55);

            font-size: 16px;
        }

        .sheet-item.active .sheet-icon {
            background: rgba(255,255,255,.18);
        }

        .sheet-name {
            flex: 1;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

            font-size: 13px;
            font-weight: 600;
        }

        .sheet-count {
            min-width: 26px;
            height: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 7px;

            border-radius: 10px;

            background: rgba(0,0,0,.05);

            font-size: 10px;
        }

        .sheet-item.active .sheet-count {
            background: rgba(255,255,255,.2);
        }

        .sidebar-footer {
            padding: 12px 10px 4px;

            color: var(--muted);

            text-align: center;

            font-size: 10px;
        }

        /* =========================================================
           MAIN
        ========================================================= */

        .main {
            width: calc(100% - var(--sidebar-width));

            margin-right: var(--sidebar-width);

            min-height: 100vh;

            padding: 25px;
        }

        /* =========================================================
           MOBILE HEADER
        ========================================================= */

        .mobile-header {
            display: none;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .menu-btn {
            width: 45px;
            height: 45px;

            border: 0;
            border-radius: 14px;

            background: var(--surface);

            box-shadow: var(--shadow-small);

            font-size: 20px;

            color: var(--text);
        }

        .mobile-title {
            font-weight: 800;
            font-size: 15px;
        }

        /* =========================================================
           HERO
        ========================================================= */

        .hero {
            background: var(--surface);

            border-radius: var(--radius-xl);

            padding: 25px;

            box-shadow: var(--shadow-light);

            margin-bottom: 22px;
        }

        .hero-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .hero-info {
            min-width: 0;
        }

        .hero-label {
            color: var(--primary);

            font-size: 12px;
            font-weight: 700;

            margin-bottom: 5px;
        }

        .hero h2 {
            font-size: clamp(20px, 3vw, 28px);

            font-weight: 800;

            margin-bottom: 5px;
        }

        .hero p {
            color: var(--muted);

            font-size: 12px;
        }

        .hero-stats {
            display: flex;
            gap: 12px;
        }

        .stat {
            min-width: 95px;

            padding: 13px;

            border-radius: 17px;

            text-align: center;

            box-shadow: var(--shadow-inset);
        }

        .stat strong {
            display: block;

            color: var(--primary);

            font-size: 20px;
            font-weight: 800;
        }

        .stat span {
            display: block;

            color: var(--muted);

            font-size: 9px;

            margin-top: 3px;
        }

        /* =========================================================
           TOOLBAR
        ========================================================= */

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;

            max-width: 550px;

            position: relative;
        }

        .search-box input {
            width: 100%;

            border: 0;
            outline: none;

            background: var(--surface);

            border-radius: 17px;

            padding: 14px 45px 14px 18px;

            color: var(--text);

            font-size: 12px;

            box-shadow: var(--shadow-inset);
        }

        .search-box input::placeholder {
            color: #9aa3ad;
        }

        .search-icon {
            position: absolute;

            right: 16px;
            top: 50%;

            transform: translateY(-50%);

            color: var(--muted);

            font-size: 16px;
        }

        .toolbar-actions {
            display: flex;
            gap: 9px;
        }

        .tool-btn {
            border: 0;

            min-width: 45px;
            height: 45px;

            padding: 0 15px;

            border-radius: 14px;

            background: var(--surface);

            color: var(--text);

            box-shadow: var(--shadow-small);

            font-size: 12px;

            transition: .2s;
        }

        .tool-btn:hover {
            transform: translateY(-2px);
        }

        .tool-btn:active {
            box-shadow: var(--shadow-inset);
        }

        .tool-btn.primary {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--primary-light),
                    var(--primary)
                );
        }

        /* =========================================================
           GRID
        ========================================================= */

        .content-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 22px;
        }

        /* =========================================================
           CARD
        ========================================================= */

        .content-card {
            background: var(--surface);

            border-radius: var(--radius-lg);

            padding: 13px;

            box-shadow: var(--shadow-light);

            overflow: hidden;

            transition:
                transform .25s ease,
                box-shadow .25s ease;
        }

        .content-card:hover {
            transform: translateY(-5px);

            box-shadow:
                -10px -10px 22px rgba(255,255,255,.95),
                 12px 12px 25px rgba(163,177,198,.38);
        }

        .card-head {
            display: flex;

            align-items: center;

            gap: 10px;

            padding: 5px 5px 12px;
        }

        .type-icon {
            width: 38px;
            height: 38px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(245,158,11,.18),
                    rgba(217,119,6,.08)
                );

            color: var(--primary);

            font-size: 17px;
        }

        .card-title {
            flex: 1;

            min-width: 0;
        }

        .card-title h3 {
            font-size: 13px;
            font-weight: 700;

            line-height: 1.6;

            overflow: hidden;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-title small {
            display: block;

            color: var(--muted);

            font-size: 9px;

            margin-top: 2px;
        }

        .type-badge {
            padding: 5px 8px;

            border-radius: 8px;

            background: rgba(0,0,0,.045);

            color: var(--muted);

            font-size: 8px;

            white-space: nowrap;
        }

        /* =========================================================
           IFRAME
        ========================================================= */

        .iframe-container {
            width: 100%;

            aspect-ratio: 16 / 10;

            border-radius: 15px;

            overflow: hidden;

            background: #dfe3e8;

            box-shadow: var(--shadow-inset);

            position: relative;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;

            display: block;

            border: 0;

            background: white;
        }

        .iframe-loader {
            position: absolute;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #e9edf1,
                    #f5f7f9
                );

            z-index: 2;

            pointer-events: none;

            transition: opacity .3s;
        }

        .iframe-loader.hidden {
            opacity: 0;
        }

        .spinner {
            width: 28px;
            height: 28px;

            border-radius: 50%;

            border: 3px solid rgba(217,119,6,.15);

            border-top-color: var(--primary);

            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================================
           CARD FOOTER
        ========================================================= */

        .card-footer {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            padding: 12px 5px 3px;
        }

        .meta {
            color: var(--muted);

            font-size: 9px;

            display: flex;
            align-items: center;
            gap: 5px;
        }

        .open-btn {
            border: 0;

            padding: 8px 12px;

            border-radius: 10px;

            color: var(--primary);

            background: rgba(217,119,6,.08);

            font-size: 9px;

            transition: .2s;
        }

        .open-btn:hover {
            color: white;

            background: var(--primary);
        }

        /* =========================================================
           SKELETON
        ========================================================= */

        .skeleton {
            background: var(--surface);

            border-radius: var(--radius-lg);

            padding: 13px;

            box-shadow: var(--shadow-light);
        }

        .skeleton-box {
            background:
                linear-gradient(
                    90deg,
                    rgba(0,0,0,.04),
                    rgba(255,255,255,.5),
                    rgba(0,0,0,.04)
                );

            background-size: 200% 100%;

            animation: skeleton 1.4s infinite;

            border-radius: 12px;
        }

        .skeleton-head {
            height: 40px;
            margin-bottom: 13px;
        }

        .skeleton-frame {
            aspect-ratio: 16 / 10;
        }

        @keyframes skeleton {
            from {
                background-position: 200% 0;
            }

            to {
                background-position: -200% 0;
            }
        }

        /* =========================================================
           EMPTY / ERROR
        ========================================================= */

        .state {
            grid-column: 1 / -1;

            min-height: 300px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            background: var(--surface);

            border-radius: var(--radius-xl);

            box-shadow: var(--shadow-inset);

            padding: 30px;
        }

        .state-icon {
            width: 70px;
            height: 70px;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;

            margin-bottom: 15px;

            box-shadow: var(--shadow-small);
        }

        .state h3 {
            font-size: 16px;
            margin-bottom: 7px;
        }

        .state p {
            color: var(--muted);
            font-size: 11px;
            max-width: 500px;
            line-height: 2;
        }

        .retry-btn {
            margin-top: 15px;

            border: 0;

            padding: 10px 18px;

            border-radius: 12px;

            color: white;

            background: var(--primary);

            font-size: 11px;
        }

        /* =========================================================
           OVERLAY
        ========================================================= */

        .overlay {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(25,30,35,.35);

            z-index: 900;

            backdrop-filter: blur(2px);
        }

        /* =========================================================
           TOAST
        ========================================================= */

        .toast {
            position: fixed;

            bottom: 25px;
            left: 25px;

            z-index: 3000;

            background: #263238;

            color: white;

            padding: 12px 17px;

            border-radius: 13px;

            font-size: 11px;

            box-shadow:
                0 10px 30px rgba(0,0,0,.2);

            opacity: 0;

            transform: translateY(15px);

            pointer-events: none;

            transition: .3s;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }


        /* =========================================================
           FOLDER TREE MENU
        ========================================================= */

        .folder-node {
            margin-bottom: 5px;
        }

        .folder-row {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
        }

        .folder-toggle {
            width: 28px;
            height: 38px;
            flex: 0 0 28px;
            border: 0;
            background: transparent;
            color: var(--muted);
            border-radius: 9px;
            cursor: pointer;
        }

        .folder-toggle:hover {
            background: rgba(0,0,0,.05);
        }

        .folder-toggle.empty {
            visibility: hidden;
        }

        .folder-toggle .arrow {
            display: inline-block;
            transition: transform .2s ease;
        }

        .folder-node.collapsed > .folder-row .folder-toggle .arrow {
            transform: rotate(90deg);
        }

        .folder-children {
            margin-right: 14px;
            padding-right: 8px;
            border-right: 1px dashed rgba(120,130,140,.22);
        }

        .folder-node.collapsed > .folder-children {
            display: none;
        }

        .folder-item {
            flex: 1;
            min-width: 0;
            margin-bottom: 0;
        }

        .folder-item .sheet-name {
            text-align: right;
        }

        .folder-item .sheet-count {
            flex-shrink: 0;
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 1250px) {

            .content-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }

        @media (max-width: 900px) {

            :root {
                --sidebar-width: 275px;
            }

            .sidebar {
                transform: translateX(100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .overlay.active {
                display: block;
            }

            .main {
                width: 100%;
                margin-right: 0;

                padding: 18px;
            }

            .mobile-header {
                display: flex;
            }

        }

        @media (max-width: 650px) {

            .hero {
                padding: 18px;
            }

            .hero-top {
                flex-direction: column;

                align-items: stretch;
            }

            .hero-stats {
                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);
            }

            .stat {
                min-width: 0;
            }

            .toolbar {
                flex-direction: column;

                align-items: stretch;
            }

            .search-box {
                max-width: none;
            }

            .toolbar-actions {
                justify-content: flex-end;
            }

            .content-grid {
                grid-template-columns: 1fr;

                gap: 16px;
            }

            .toast {
                left: 15px;
                right: 15px;
                bottom: 15px;

                text-align: center;
            }

        }
		
		.card-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.download-btn {
    border: 0;

    padding: 8px 13px;

    border-radius: 10px;

    color: white;

    background:
        linear-gradient(
            135deg,
            var(--primary-light),
            var(--primary)
        );

    font-family: inherit;

    font-size: 9px;

    cursor: pointer;

    transition: .2s ease;

    box-shadow:
        0 4px 10px rgba(217,119,6,.18);
}

.download-btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 7px 15px rgba(217,119,6,.25);
}

.download-btn:active {
    transform: scale(.96);
}

/* =========================================================
   FIXED STATIC MENU
========================================================= */

.static-menu {
    margin-bottom: 18px;
}

.static-menu-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

    border: 0;
    border-radius: 14px;
    padding: 13px 15px;

    background: var(--surface);
    color: var(--text);

    font-family: inherit;
    font-size: 13px;
    font-weight: 800;

    cursor: pointer;

    box-shadow: var(--shadow-small);
    transition: .2s ease;
}

.static-menu-toggle:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-light);
}

.static-menu-toggle:active {
    transform: scale(.98);
}

.static-menu-toggle .menu-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.static-menu-icon {
    font-size: 18px;
}

.static-menu-arrow {
    font-size: 13px;
    transition: transform .25s ease;
}

.static-menu.open .static-menu-arrow {
    transform: rotate(180deg);
}

.static-menu-items {
    display: none;
    flex-direction: column;
    gap: 7px;

    margin-top: 9px;
    padding: 8px;

    border-radius: 14px;
    background: rgba(255,255,255,.55);
    box-shadow: inset 2px 2px 5px rgba(0,0,0,.04);
}

.static-menu.open .static-menu-items {
    display: flex;
}

.static-menu-item {
    display: flex;
    align-items: center;
    gap: 10px;

    width: 100%;
    padding: 11px 12px;

    border: 0;
    border-radius: 11px;

    background: transparent;
    color: var(--text);

    font-family: inherit;
    font-size: 12px;
    font-weight: 600;

    text-decoration: none;
    cursor: pointer;

    transition: .2s ease;
}

.static-menu-item:hover {
    background: var(--surface);
    color: var(--primary);
    transform: translateX(-2px);
}

.static-menu-item-icon {
    width: 25px;
    text-align: center;
    font-size: 16px;
}

.static-menu-divider {
    height: 1px;
    margin: 4px 2px 16px;
    background: rgba(0,0,0,.07);
}
.live-icon {
    display: inline-block;
    margin-left: 6px;
    color: #00d084;
    font-size: 12px;
    animation: liveBlink 1.2s infinite;
}

@keyframes liveBlink {
    0%, 100% {
        opacity: 1;
        transform: scale(1);
    }
    50% {
        opacity: 0.25;
        transform: scale(0.8);
    }
}

/* =========================================================
   ID DISPLAY
========================================================= */

.folder-id-box {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 3px 0 5px;
    padding-right: 4px;
}

.folder-id-text {
    flex: 1;
    min-width: 0;

    font-family: monospace;
    font-size: 8px;
    color: var(--muted);

    background: rgba(0,0,0,.035);
    padding: 5px 7px;

    border-radius: 7px;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;

    direction: ltr;
    text-align: left;
}

.copy-id-btn {
    flex: 0 0 auto;

    border: 0;
    padding: 5px 7px;

    border-radius: 7px;

    background: rgba(217,119,6,.08);
    color: var(--primary);

    font-family: inherit;
    font-size: 8px;

    cursor: pointer;

    transition: .2s ease;
}

.copy-id-btn:hover {
    background: var(--primary);
    color: white;
    transform: translateY(-1px);
}

.copy-id-btn:active {
    transform: scale(.95);
}


/* =========================================================
   FOLDER OPEN DRIVE BUTTON
========================================================= */

.folder-drive-btn {
    border: 0;

    padding: 5px 7px;

    border-radius: 7px;

    background: rgba(66,133,244,.08);

<!-- TOAST -->

<div

<script>

    /* =========================================================
       CONFIG
    ========================================================= */

    const GAS_API_URL =
        "https://script.google.com/macros/s/AKfycbyj7xhVyPDylSzeril8ZOMSxivJKHeukYmRN4K6orpZF4Ur71EdfxRRaourbfPRyu-m/exec";

    const state = {
        roots: [],
        folders: [],
        currentFolder: null,
        currentItems: [],
        filteredItems: [],
        loading: false
    };

    const sheetMenu = document.getElementById("sheetMenu");
    const contentGrid = document.getElementById("contentGrid");
    const pageTitle = document.getElementById("pageTitle");
    const pageDescription = document.getElementById("pageDescription");
    const mobileTitle = document.getElementById("mobileTitle");
    const totalSheets = document.getElementById("totalSheets");
    const totalItems = document.getElementById("totalItems");
    const searchInput = document.getElementById("searchInput");

    document.addEventListener("DOMContentLoaded", init);

    async function init() {
        if (!GAS_API_URL || GAS_API_URL === "YOUR_GAS_WEB_APP_URL_HERE") {
            showError("آدرس GAS تنظیم نشده است", "مقدار GAS_API_URL را در کد وارد کنید.");
            return;
        }
        await loadFolders();
    }

    async function api(params = {}) {
        const url = new URL(GAS_API_URL);
        Object.entries(params).forEach(([key, value]) => {
            if (value !== undefined && value !== null && value !== "") {
                url.searchParams.set(key, value);
            }
        });

        const response = await fetch(url.toString(), {
            method: "GET",
            mode: "cors",
            cache: "no-store",
            redirect: "follow"
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (data && data.success === false) {
            throw new Error(data.message || data.error || "خطا در دریافت اطلاعات");
        }
        return data;
    }

    async function loadFolders() {
        showSheetLoading();
        try {
            const data = await api({ action: "folders" });
            state.roots = data.roots || [];
            state.folders = flattenFolders(state.roots);

            totalSheets.textContent = formatNumber(state.folders.length);
            renderFolderTree();

            if (state.roots.length) {
                await selectFolder(state.roots[0]);
            } else {
                showEmpty("هیچ پوشه‌ای پیدا نشد", "پوشه‌ای در Root Folder ثبت نشده است.");
            }
        } catch (error) {
            console.error(error);
            showSheetError();
            showToast("خطا در دریافت ساختار پوشه‌ها");
        }
    }

    function flattenFolders(nodes, result = []) {
        nodes.forEach(node => {
            result.push(node);
            flattenFolders(node.children || [], result);
        });
        return result;
    }

    function renderFolderTree() {
        if (!state.roots.length) {
            sheetMenu.innerHTML = "";
            return;
        }

        sheetMenu.innerHTML = state.roots.map((node, index) =>
            createFolderNode(node, index === 0)
        ).join("");
    }

    function createFolderNode(node, firstRoot = false) {

    const hasChildren =
        node.children &&
        node.children.length > 0;

    const children = hasChildren
        ? `
            <div class="folder-children">
                ${node.children
                    .map(child => createFolderNode(child, false))
                    .join("")}
            </div>
        `
        : "";

    const folderUrl =
        node.id
            ? `https://drive.google.com/drive/folders/${encodeURIComponent(node.id)}`
            : "";

    return `
        <div
            class="folder-node"
            data-folder-id="${escapeAttr(node.id)}"
        >

            <div class="folder-row">

                <button
                    class="folder-toggle ${hasChildren ? "" : "empty"}"
                    onclick="toggleFolderNode(event, '${escapeJS(node.id)}')"
                    aria-label="باز و بسته کردن"
                >
                    <span class="arrow">◀</span>
                </button>


                <div class="folder-item">

                    <button
                        class="sheet-item ${firstRoot ? "active" : ""}"
                        data-folder-id="${escapeAttr(node.id)}"
                        onclick="selectFolderById('${escapeJS(node.id)}')"
                    >

                        <span class="sheet-icon">
                            📁
                        </span>

                        <span
                            class="sheet-name"
                            title="${escapeAttr(node.path || node.name)}"
                        >
                            ${escapeHtml(node.name)}
                        </span>

                        <span class="sheet-count">
                            📂
                        </span>

                    </button>


                    <!-- FOLDER ID -->

                    <div class="folder-id-box">

                        <span
                            class="folder-id-text"
                            title="${escapeAttr(node.id)}"
                        >
                            ${escapeHtml(node.id)}
                        </span>

                        <button
                            class="copy-id-btn"
                            onclick="copyId(event, '${escapeJS(node.id)}', 'شناسه پوشه')"
                            title="کپی Folder ID"
                        >
                            📋
                        </button>

                        ${
                            folderUrl
                            ? `
                                <button
                                    class="folder-drive-btn"
                                    onclick="openDriveFolder(event, '${escapeJS(node.id)}')"
                                    title="باز کردن پوشه در Google Drive"
                                >
                                    🔗
                                </button>
                            `
                            : ""
                        }

                    </div>

                </div>

            </div>

            ${children}

        </div>
    `;
}

    function toggleFolderNode(event, folderId) {
        event.stopPropagation();
        const node = document.querySelector(`.folder-node[data-folder-id="${CSS.escape(folderId)}"]`);
        if (node) node.classList.toggle("collapsed");
    }

    function selectFolderById(folderId) {
        const folder = state.folders.find(item => item.id === folderId);
        if (folder) selectFolder(folder);
    }

    async function selectFolder(folder) {
        state.currentFolder = folder;
        updateActiveFolder(folder.id);

        pageTitle.textContent = folder.name;
        mobileTitle.textContent = folder.name;
        pageDescription.textContent = "در حال دریافت محتوای این پوشه...";
        searchInput.value = "";
        showSkeletons();
        closeSidebar();

        try {
            const data = await api({
                action: "items",
                sheet: folder.rootSheet,
                path: folder.path,
                recursive: "1"
            });

            state.currentItems = data.items || [];
            state.filteredItems = [...state.currentItems];

            totalItems.textContent = formatNumber(state.currentItems.length);
            pageDescription.textContent =
                `${formatNumber(state.currentItems.length)} محتوا در «${folder.name}» و زیرپوشه‌های آن`;

            renderItems();
        } catch (error) {
            console.error(error);
            showError("خطا در دریافت محتوا", error.message || "امکان دریافت اطلاعات وجود ندارد.");
            showToast("دریافت محتوا ناموفق بود");
        }
    }

    function updateActiveFolder(folderId) {
        document.querySelectorAll(".folder-item").forEach(item => {
            item.classList.toggle("active", item.dataset.folderId === folderId);
        });
    }

    function renderItems() {
        if (!state.filteredItems.length) {
            showEmpty("این پوشه خالی است", "در این پوشه یا زیرپوشه‌های آن فایل قابل نمایش پیدا نشد.");
            return;
        }
        contentGrid.innerHTML = state.filteredItems.map(createCard).join("");
    }

   function createCard(item, index) {

    const title =
        item.name || "بدون عنوان";

    const type =
        item.type || detectType(item);

    const icon =
        item.icon || getTypeIcon(type);

    const embedUrl =
        item.embedUrl || createFallbackEmbed(item);

    const updated =
        item.updated || "تاریخ نامشخص";

    const path =
        item.path || "";

    const id =
        item.id || "";

    const driveUrl =
        id
            ? `https://drive.google.com/file/d/${encodeURIComponent(id)}/view`
            : "";

    return `

        <article
            class="content-card"
            data-index="${index}"
        >

            <!-- CARD HEADER -->

            <div class="card-head">

                <div class="type-icon">
                    ${icon}
                </div>

                <div class="card-title">

                    <h3
                        title="${escapeAttr(title)}"
                    >
                        ${escapeHtml(title)}
                    </h3>

                    <small
                        title="${escapeAttr(path)}"
                    >
                        ${escapeHtml(path)}
                    </small>

                </div>

                <span class="type-badge">
                    ${escapeHtml(type)}
                </span>

            </div>


            <!-- IFRAME -->

            <div class="iframe-container">

                <div
                    class="iframe-loader"
                    id="loader-${index}"
                >
                    <div class="spinner"></div>
                </div>

                <iframe
                    src="${escapeAttr(embedUrl)}"
                    title="${escapeAttr(title)}"
                    loading="lazy"
                    allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
                    allowfullscreen
                    referrerpolicy="no-referrer"
                    onload="hideIframeLoader(${index})"
                ></iframe>

            </div>


            <!-- FILE ID -->

            ${
                id
                ? `
                    <div class="file-id-area">

                        <span class="file-id-label">
                            🆔 شناسه فایل Google Drive
                        </span>

                        <div class="file-id-row">

                            <span
                                class="file-id-value"
                                title="${escapeAttr(id)}"
                            >
                                ${escapeHtml(id)}
                            </span>

                            <button
                                class="file-id-copy"
                                onclick="copyId(
                                    event,
                                    '${escapeJS(id)}',
                                    'شناسه فایل'
                                )"
                                title="کپی File ID"
                            >
                                📋 کپی
                            </button>

                            ${
                                driveUrl
                                ? `
                                    <button
                                        class="file-drive-btn"
                                        onclick="openDriveFile(
                                            event,
                                            '${escapeJS(id)}'
                                        )"
                                        title="باز کردن فایل در Google Drive"
                                    >
                                        🔗
                                    </button>
                                `
                                : ""
                            }

                        </div>

                    </div>
                `
                : `
                    <div class="file-id-area">

                        <span class="file-id-label">
                            🆔 شناسه فایل
                        </span>

                        <div class="file-id-value">
                            شناسه موجود نیست
                        </div>

                    </div>
                `
            }


            <!-- FOOTER -->

            <div class="card-footer">

                <div class="meta">

                    <span>🕒</span>

                    <span>
                        ${escapeHtml(updated)}
                    </span>

                </div>


                <div class="card-actions">

                    <button
                        class="open-btn"
                        onclick="fullscreenContent(${index})"
                        title="بزرگنمایی محتوا"
                    >
                        ⛶ بزرگنمایی
                    </button>

                    ${
                        id
                        ? `
                            <button
                                class="download-btn"
                                onclick="downloadContent(
                                    '${escapeJS(id)}',
                                    '${escapeJS(title)}'
                                )"
                                title="دانلود محتوا"
                            >
                                ↓ دانلود
                            </button>
                        `
                        : ""
                    }

                </div>

            </div>

        </article>

    `;
}

    function hideIframeLoader(index) {
        const loader = document.getElementById(`loader-${index}`);
        if (loader) loader.classList.add("hidden");
    }

    function createFallbackEmbed(item) {
        if (!item.id) return item.url || "";
        const mime = (item.mimeType || "").toLowerCase();
        if (mime.includes("google-apps.document")) return `https://docs.google.com/document/d/${item.id}/preview`;
        if (mime.includes("google-apps.spreadsheet")) return `https://docs.google.com/spreadsheets/d/${item.id}/preview`;
        if (mime.includes("google-apps.presentation")) return `https://docs.google.com/presentation/d/${item.id}/preview`;
        return `https://drive.google.com/file/d/${item.id}/preview`;
    }

    let searchTimer = null;
    searchInput.addEventListener("input", function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(performSearch, 180);
    });

    function performSearch() {
        const query = searchInput.value.trim().toLowerCase();
        if (!query) {
            state.filteredItems = [...state.currentItems];
        } else {
            state.filteredItems = state.currentItems.filter(item => {
              const text = [
    item.name,
    item.id,
    item.type,
    item.mimeType,
    item.category,
    item.path,
    item.updated
]
.filter(Boolean)
.join(" ")
.toLowerCase();
                return text.includes(query);
            });
        }
        renderItems();
        totalItems.textContent = formatNumber(state.filteredItems.length);
    }

    async function refreshCurrentSheet() {
        if (!state.currentFolder) {
            await loadFolders();
            return;
        }
        showToast("در حال بروزرسانی...");
        await loadFolders();
        const refreshed = state.folders.find(item => item.id === state.currentFolder.id);
        if (refreshed) await selectFolder(refreshed);
        showToast("اطلاعات بروزرسانی شد");
    }

    function showSkeletons() {
        contentGrid.innerHTML = Array.from({length: 6}).map(() => `
            <div class="skeleton">
                <div class="skeleton-box skeleton-head"></div>
                <div class="skeleton-box skeleton-frame"></div>
            </div>
        `).join("");
    }

    function showEmpty(title, message) {
        contentGrid.innerHTML = `
            <div class="state">
                <div class="state-icon" style="background:rgba(217,119,6,.08);">📭</div>
                <h3>${escapeHtml(title)}</h3>
                <p>${escapeHtml(message)}</p>
            </div>
        `;
    }

    function showError(title, message) {
        contentGrid.innerHTML = `
            <div class="state">
                <div class="state-icon" style="background:rgba(220,38,38,.08);">⚠️</div>
                <h3>${escapeHtml(title)}</h3>
                <p>${escapeHtml(message)}</p>
                <button class="retry-btn" onclick="refreshCurrentSheet()">تلاش مجدد</button>
            </div>
        `;
    }

    function showSheetLoading() {
        sheetMenu.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;padding:30px;">
                <div class="spinner"></div>
            </div>
        `;
    }

    function showSheetError() {
        sheetMenu.innerHTML = `
            <div style="padding:25px 10px;text-align:center;color:#8a949d;font-size:11px;line-height:2;">
                ⚠️<br>دریافت ساختار پوشه‌ها ناموفق بود<br>
                <button onclick="loadFolders()" style="margin-top:10px;border:0;padding:8px 13px;border-radius:10px;background:#d97706;color:white;font-family:inherit;font-size:10px;">تلاش مجدد</button>
            </div>
        `;
    }

    function getTypeIcon(type) {
        const value = String(type || "").toLowerCase();
        if (value.includes("تصویر") || value.includes("image")) return "🖼️";
        if (value.includes("ویدئو") || value.includes("video")) return "🎬";
        if (value.includes("pdf")) return "📄";
        if (value.includes("sheet") || value.includes("spreadsheet")) return "📊";
        if (value.includes("slide") || value.includes("presentation")) return "📽️";
        if (value.includes("doc") || value.includes("document")) return "📝";
        return "📁";
    }

    function detectType(item) {
        return item.type || "فایل";
    }

    function formatNumber(value) {
        return Number(value || 0).toLocaleString("fa-IR");
    }

    function toggleSidebar() {
        const sidebar = document.querySelector(".sidebar");
        const overlay = document.querySelector(".overlay");
        if (sidebar) sidebar.classList.toggle("open");
        if (overlay) overlay.classList.toggle("active");
    }

    function closeSidebar() {
        const sidebar = document.querySelector(".sidebar");
        const overlay = document.querySelector(".overlay");
        if (sidebar) sidebar.classList.remove("open");
        if (overlay) overlay.classList.remove("active");
    }

    function scrollToTop() {
        window.scrollTo({top: 0, behavior: "smooth"});
    }

    function showToast(message) {
        const toast = document.getElementById("toast");
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeAttr(value) {
        return escapeHtml(value);
    }

    function escapeJS(value) {
        return String(value ?? "")
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'")
            .replace(/\r/g, "\\r")
            .replace(/\n/g, "\\n");
    }
	/* =========================================================
   COPY ID
========================================================= */

async function copyId(event, id, label = "شناسه") {

    if (event) {
        event.stopPropagation();
        event.preventDefault();
    }

    if (!id) {
        showToast(`${label} موجود نیست`);
        return;
    }

    try {

        await navigator.clipboard.writeText(id);

        showToast(
            `✅ ${label} با موفقیت کپی شد`
        );

    } catch (error) {

        // Fallback برای مرورگرهایی که Clipboard API ندارند

        const textarea =
            document.createElement("textarea");

        textarea.value = id;

        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";

        document.body.appendChild(textarea);

        textarea.focus();
        textarea.select();

        try {

            document.execCommand("copy");

            showToast(
                `✅ ${label} با موفقیت کپی شد`
            );

        } catch (copyError) {

            showToast(
                "❌ کپی کردن شناسه ناموفق بود"
            );

        }

        textarea.remove();
    }
}


/* =========================================================
   OPEN DRIVE FOLDER
========================================================= */

function openDriveFolder(event, id) {

    if (event) {
        event.stopPropagation();
        event.preventDefault();
    }

    if (!id) return;

    const url =
        `https://drive.google.com/drive/folders/${encodeURIComponent(id)}`;

    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );
}


/* =========================================================
   OPEN DRIVE FILE
========================================================= */

function openDriveFile(event, id) {

    if (event) {
        event.stopPropagation();
        event.preventDefault();
    }

    if (!id) return;

    const url =
        `https://drive.google.com/file/d/${encodeURIComponent(id)}/view`;

    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );
}

    function fullscreenContent(index) {
        const card = document.querySelector(`.content-card[data-index="${index}"]`);
        const iframe = card ? card.querySelector("iframe") : null;
        if (!iframe) return;
        if (iframe.requestFullscreen) iframe.requestFullscreen();
        else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
    }

    function downloadContent(id, title) {
        if (!id) return;
        const url = `https://drive.google.com/uc?export=download&id=${encodeURIComponent(id)}`;
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener";
        a.download = title || "download";
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    function toggleStaticMenu() {
        const menu = document.getElementById("staticMenu");
        if (menu) menu.classList.toggle("open");
    }

</script>
